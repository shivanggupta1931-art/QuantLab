<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantLab | Training </title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/training.css">
</head>
<body>
    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="logo">
           📈 <span>QuantLab</span>
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="challenge.html">Challenge</a>
            <a href="training.html" class="active">Training</a>
            <a href="replay.html">Replay</a>
        </nav>
    </header>


    <!-- ================= MAIN ================= -->
     <main class="training">
        <div class="container">
            <a href="index.html">Back to skills</a>


            <!-- Hero -->
             <section class="training-hero">
                <div class="training-icon" id="trainingIcon">🎲</div>
                <div class="training-content">
                    <span class="training-badge" id="trainingBadge">Core Skill</span>
                    <h1 id="trainingTitle">Probability</h1>
                      <p id="trainingDescription">
                        Learn to reason under uncertainty using probability,
                        statistics and expected value.
                    </p>
                </div>
             </section>



             <!-- Progress -->
              <section class="training-progres">
                <div class="training-header">
                    <span>Progress</span>
                    <span id="trainingProgressValue">0%</span>

                </div>

                <div class="progress-bar">
                    <div class="progress-fill"
                         id="trainingProgressFill"
                         style="width:0%">

                    </div>
                </div>
            </section>


            <!-- Stats -->
             <section class="training-stats">
                <div class="training-stat">
                    <span>Questions</span>
                    <strong id="trainingQuestions">20</strong>
                </div>

                <div class="training-stat">
                    <span>Duration</span>
                    <strong id="trainingDuration">2 hours
                    </strong>
                </div>

                <div class="training-stat">
                    <span>Difficulty</span>
                     <strong id="trainingDifficulty">
                        Beginner → Advanced
                    </strong>
                </div>

             </section>

              <!-- Start -->
            <section class="training-start">
                <button class="btn btn-primary" 
                id="startTrainingBtn">
                Start Training->
                </button>
            </section>



            <!-- Question Area -->
            <section
            class="training-session"
            id="trainingSesssion">
            <!-- Question Area -->


            </section>

        </div>
     </main>
     <script src="js/skills/skills.js"></script>
     <script src="js/training/training.js"></script>
    
</body>
</html>
